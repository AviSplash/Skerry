name: Release

# Builds the installers and publishes one GitHub release per platform:
#   "<version> - Windows"  (tag <version>-windows)
#   "<version> - macOS"    (tag <version>-macos)
#   "<version> - Linux"    (tag <version>-linux)
#
# Run it from the Actions tab (Release → Run workflow → version, e.g. v1.1),
# or push a tag like v1.1 to release that version. The app version is taken
# from the release name (v1.1 → 1.1.0).
#
# In-app updates: when the repository has the secrets
# TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD, the
# installers are also signed for the updater, and once every platform has
# built, latest.json on the `updater` branch is replaced. Installed copies of
# Skerry read that file to find and verify new versions. Without the secrets
# the releases are published as usual and installed copies are not told.
#
# macOS signing: with the secrets MACOS_CERTIFICATE (base64 .p12) and
# MACOS_CERTIFICATE_PASSWORD, every Mac build is signed with that certificate,
# so macOS keeps Skerry's Accessibility and Input Monitoring permissions across
# updates (see .github/scripts/macos-signing.sh). Without them, builds are
# ad-hoc signed and users must re-allow Skerry after each update.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v1.0"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  desktop:
    name: ${{ matrix.label }}
    outputs:
      signed: ${{ steps.collect.outputs.signed }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            slug: windows
            os: windows-latest
            args: ""
          - label: macOS
            slug: macos
            os: macos-latest
            args: "--target universal-apple-darwin"
          - label: Linux
            slug: linux
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      - name: Set the version
        shell: bash
        run: |
          v="${VERSION#v}"
          case "$v" in *.*.*) ;; *.*) v="$v.0" ;; *) v="$v.0.0" ;; esac
          echo "SEMVER=$v" >> "$GITHUB_ENV"
          SEMVER="$v" node -e '
            const fs = require("fs");
            const v = process.env.SEMVER;
            const cargo = fs.readFileSync("Cargo.toml", "utf8").replace(/^version = "[^"]*"/m, `version = "${v}"`);
            fs.writeFileSync("Cargo.toml", cargo);
            const p = "apps/skerry-app/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = v;
            c.bundle.createUpdaterArtifacts = !!process.env.TAURI_SIGNING_PRIVATE_KEY;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
            console.log(`version ${v}, updater signing ${c.bundle.createUpdaterArtifacts ? "on" : "off (no TAURI_SIGNING_PRIVATE_KEY secret)"}`);
          '
          grep -m1 '^version' Cargo.toml
      - name: Set up macOS code signing
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: .github/scripts/macos-signing.sh
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/skerry-app
          tauriScript: npx --yes @tauri-apps/cli@2
          args: ${{ matrix.args }}
      - name: Collect release files
        id: collect
        shell: bash
        run: node .github/scripts/collect-release.mjs ${{ matrix.slug }}
      - name: Keep installers as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: skerry-${{ matrix.slug }}
          if-no-files-found: error
          path: dist/*
      - name: Keep updater entries for the update feed
        if: steps.collect.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.slug }}
          path: updater/*.json
      - name: Write release notes
        shell: bash
        run: |
          repo="https://github.com/${{ github.repository }}"
          {
            echo "Skerry for **${{ matrix.label }}**. Install it on every computer you want to share one mouse and keyboard between."
            echo
            echo "**Already have Skerry 1.1 or later?** It updates itself: open Skerry and click **Update and restart** when it says a new version is available. Coming from 1.0, install this version once over the old one; your pairings and settings are kept."
            echo
            echo "### Install"
            case "${{ matrix.slug }}" in
              windows)
                echo "1. Download \`Skerry_..._x64-setup.exe\` below (or the \`.msi\` if you prefer)."
                echo "2. If Windows says *\"Windows protected your PC\"*, click **More info → Run anyway** (this build isn't code-signed yet)."
                echo "3. Approve the administrator prompt at the end of the installation: it adds the Windows Firewall rule that lets your other computers connect to this one. If you skip it, Skerry shows an **Allow Skerry** button later."
                ;;
              macos)
                echo "1. Download the \`.dmg\` below (one file for both Apple Silicon and Intel Macs) and drag Skerry to Applications."
                echo "2. The first time, **right-click Skerry → Open** (this build isn't code-signed yet)."
                echo "3. Switch Skerry on in **System Settings → Privacy & Security → Accessibility** (and **Input Monitoring** if it's listed there)."
                echo "4. When macOS asks whether Skerry may find devices on your local network, click **Allow**."
                echo
                echo "If Skerry says it needs permission although it's already switched on (common after updating from 1.1.0 or earlier), click **Reset permissions** in Skerry's banner and allow it again when macOS asks."
                echo
                echo "If macOS says the app is damaged, run \`xattr -dr com.apple.quarantine /Applications/Skerry.app\` in Terminal."
                ;;
              linux)
                echo "- **Debian / Ubuntu / Mint:** download the \`.deb\` and open it, or run \`sudo apt install ./Skerry_*.deb\`."
                echo "- **Fedora / openSUSE:** download the \`.rpm\` and run \`sudo dnf install ./Skerry-*.rpm\`."
                echo "- **Any other distro:** download the \`.AppImage\`, run \`chmod +x Skerry_*.AppImage\`, then start it."
                echo
                echo "On GNOME or KDE (Wayland), approve the *Remote desktop* and *Input capture* requests the first time."
                ;;
            esac
            echo
            echo "### Get started"
            echo "Start Skerry on two computers on the same network, click **Pair** on one, type the code the other one shows, then drag it to the side of the screen where it sits on your desk. Ctrl+Alt+Shift+Esc always brings the mouse back."
            echo
            echo "### Other platforms"
            for p in windows:Windows macos:macOS linux:Linux; do
              slug="${p%%:*}"; label="${p#*:}"
              [ "$slug" = "${{ matrix.slug }}" ] || echo "- [${VERSION} - ${label}](${repo}/releases/tag/${VERSION}-${slug})"
            done
          } > release-notes.md
          cat release-notes.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}-${{ matrix.slug }}
          name: ${{ env.VERSION }} - ${{ matrix.label }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true

  update-feed:
    name: Update feed
    needs: desktop
    if: needs.desktop.outputs.signed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: updater
          merge-multiple: true
      - name: Write latest.json
        run: |
          v="${VERSION#v}"
          case "$v" in *.*.*) ;; *.*) v="$v.0" ;; *) v="$v.0.0" ;; esac
          SEMVER="$v" node .github/scripts/update-feed.mjs updater latest.json
      - name: Publish it on the updater branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir feed && cp latest.json feed/
          cd feed
          printf '%s\n' "This branch holds latest.json, the file installed copies of Skerry read to find new versions." \
            "The Release workflow replaces it after every release. Don't edit it by hand." > README.md
          git init -q -b updater
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Update feed for ${VERSION}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" updater

  cli:
    name: Command-line app (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: skerry-cli
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: skerry-cli.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: skerry-cli
          - os: macos-latest
            target: x86_64-apple-darwin
            exe: skerry-cli
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p skerry-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="skerry-cli-${VERSION}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" README.md LICENSE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: skerry-cli-${{ matrix.target }}
          path: skerry-cli-*.*
