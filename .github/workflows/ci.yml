name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb sway
      - uses: Swatinem/rust-cache@v2
      - name: Unit and end-to-end tests
        run: cargo test -p skerry-core -p skerry-platform
      - name: Build command-line app
        run: cargo build -p skerry-cli
      - name: Build desktop app
        run: cargo build -p skerry-app
      - name: Desktop app tests (uninstall script, login item)
        run: cargo test -p skerry-app
      - name: macOS signing keeps one identity across builds
        if: runner.os == 'macOS'
        run: |
          # Same steps as a release, with a throwaway certificate made the
          # way users make theirs: with macOS's own openssl (LibreSSL) and
          # with OpenSSL 3.
          d="$(mktemp -d)"
          ossl3="$(brew --prefix openssl@3 2>/dev/null)/bin/openssl"
          if [ -x "$ossl3" ]; then
            OPENSSL="$ossl3" .github/scripts/make-macos-certificate.sh "$d/cert3"
            pw="$(cat "$d/cert3/MACOS_CERTIFICATE_PASSWORD.txt")"
            security create-keychain -p ci "$d/probe.keychain-db"
            security import "$d/cert3/skerry-signing.p12" -k "$d/probe.keychain-db" -P "$pw"
            security delete-keychain "$d/probe.keychain-db"
          fi
          OPENSSL=/usr/bin/openssl .github/scripts/make-macos-certificate.sh "$d/cert"
          MACOS_CERTIFICATE="$(cat "$d/cert/MACOS_CERTIFICATE.txt")" \
            MACOS_CERTIFICATE_PASSWORD="$(cat "$d/cert/MACOS_CERTIFICATE_PASSWORD.txt")" \
            GITHUB_ENV="$d/env" .github/scripts/macos-signing.sh
          identity="$(sed -n 's/^APPLE_SIGNING_IDENTITY=//p' "$d/env")"
          [ -n "$identity" ] || { echo "signing was not set up"; exit 1; }
          # Two different builds of one app must have the same designated
          # requirement, or macOS forgets its permissions on every update.
          cp target/debug/skerry-cli "$d/build1"
          cp /usr/bin/true "$d/build2"
          for b in build1 build2; do
            codesign --force --sign "$identity" --options runtime --identifier org.skerry.app "$d/$b"
          done
          r1="$(codesign -d -r- "$d/build1" 2>&1 | grep designated)"
          r2="$(codesign -d -r- "$d/build2" 2>&1 | grep designated)"
          echo "$r1"
          [ "$r1" = "$r2" ] || { echo "requirements differ: $r2"; exit 1; }
          case "$r1" in *cdhash*) echo "requirement is tied to a single build"; exit 1 ;; esac
          "$d/build2"
          "$d/build1" --help > /dev/null
      - name: macOS app bundle is signed as Skerry
        if: runner.os == 'macOS'
        working-directory: apps/skerry-app
        run: |
          # Without a certificate the whole bundle must still be signed as
          # org.skerry.app, or macOS never applies Skerry's permissions.
          npx --yes @tauri-apps/cli@2 build --debug --bundles app --ci
          ../../.github/scripts/macos-verify-signature.sh ../../target/debug/bundle/macos/Skerry.app org.skerry.app
      - name: X11 backend against a real X server
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          DISPLAY=:99 cargo test -p skerry-platform --test x11 -- --ignored
      - name: wlroots backend against headless Sway
        if: runner.os == 'Linux'
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman sway -c /dev/null &
          for _ in $(seq 1 50); do ls "$XDG_RUNTIME_DIR" | grep -qE '^wayland-[0-9]+$' && break; sleep 0.2; done
          export WAYLAND_DISPLAY="$(ls "$XDG_RUNTIME_DIR" | grep -E '^wayland-[0-9]+$' | head -1)"
          export SWAYSOCK="$(ls "$XDG_RUNTIME_DIR"/sway-ipc.*.sock | head -1)"
          cargo test -p skerry-platform --test wlr -- --ignored
